<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A letter for you</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf0e4;--ink:#5a2a2a;--paper:#fffaf0;--gold1:#f7e08a;--gold2:#c9972b;--gold3:#8a5f12;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#f1e4d6}}
:root[data-theme="dark"]{--bg:#f1e4d6}
html{height:100%;background:var(--bg) radial-gradient(circle at 50% 30%,rgba(255,255,255,.75),transparent 62%);transition:background-color 1.8s ease;scroll-padding-top:env(safe-area-inset-top,0px)}
html.hug{--bg:#fde5bd}
html.kiss{--bg:#fcd9e4}
body{margin:0;height:100%;display:grid;place-items:center;overflow:hidden;font-family:'Quicksand',system-ui,sans-serif;color:var(--ink)}
#stage{display:flex;flex-direction:column;align-items:center;gap:34px}
#wrap{position:relative;width:min(88vw,340px);height:232px;perspective:900px;cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
#wrap>*{position:absolute}
.back{inset:0;border-radius:8px;background:linear-gradient(#a81a2c,#7d0f1e);box-shadow:0 22px 34px rgba(125,15,30,.32);z-index:0}
.front{inset:0;border-radius:8px;background:linear-gradient(160deg,#d3374a,#a51a2c);clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);z-index:3}
.flap{left:0;right:0;top:0;height:54%;background:linear-gradient(#e24c5f,#b01f31);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;z-index:4}
.seal{left:50%;top:54%;width:88px;height:88px;margin:-44px 0 0 -44px;z-index:6;display:grid;place-items:center;
border-radius:52% 48% 54% 46%/48% 54% 46% 52%;background:radial-gradient(circle at 35% 30%,var(--gold1),var(--gold2) 60%,var(--gold3));
box-shadow:0 5px 11px rgba(0,0,0,.35),inset 0 0 0 4px rgba(255,235,160,.35),inset 0 -5px 9px rgba(90,55,5,.4);animation:pulse 2.4s ease-in-out infinite}
.seal::before{content:"";position:absolute;inset:7px;border-radius:inherit;border:1.5px solid rgba(110,70,8,.45)}
.seal span{font-family:'Great Vibes','Brush Script MT',cursive;font-size:23px;color:#b0801a;text-shadow:0 1px 0 rgba(255,246,205,.9),0 -1px 1px rgba(80,48,4,.7);transform:rotate(-6deg)}
.letter{left:6%;right:6%;bottom:8px;height:200px;z-index:2;background:var(--paper);border-radius:6px;box-shadow:0 4px 14px rgba(80,20,20,.2);
display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px;transition:transform .9s,height .9s}
.hint{margin:0;font-weight:700;font-size:15px;letter-spacing:.04em;color:#a81a2c;animation:bob 1.8s ease-in-out infinite;transition:opacity .4s}
.open+.hint{opacity:0}
.open .flap{animation:flap .8s forwards}
.open .seal{animation:sealGo .5s forwards}
.open .letter{transform:translateY(-130px);transition:transform .9s .55s cubic-bezier(.3,1.2,.4,1)}
.read .back,.read .front,.read .flap,.read .seal{opacity:0;pointer-events:none;transition:opacity .9s}
.read .letter{height:340px;transform:translateY(62px);transition:transform .9s,height .9s}
.ask h1{font-family:'Great Vibes',cursive;font-weight:400;font-size:34px;line-height:1.15;color:#a81a2c;margin:6px 0 18px}
.hrt{font-size:22px;color:#e0475a}
.choices{display:flex;gap:12px;justify-content:center;pointer-events:none}
.read .choices{pointer-events:auto}
.btn{font:700 16px 'Quicksand',system-ui,sans-serif;border:0;border-radius:999px;padding:11px 20px;cursor:pointer;transition:transform .2s;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.btn:hover,.btn:focus-visible{transform:scale(1.08) rotate(-2deg)}
.btn.hug{background:linear-gradient(#ffe39a,#f2b84b);color:#6b3b05}
.btn.kiss{background:linear-gradient(#ff9bb3,#ee6283);color:#fff}
.ask,.scene{transition:opacity .5s}
.go .ask{display:none}
.scene{display:none;position:relative;width:100%;height:100%;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.go .scene{display:flex}
.pair{position:relative;display:flex;justify-content:center;gap:8px;margin-top:14px}
.c{width:105px}
.c2 svg{transform:scaleX(-1)}
.cat{width:100%;display:block;overflow:visible}
.head{transform-origin:50px 62px;animation:nod 2s ease-in-out infinite alternate}
.tail{transform-origin:26px 96px;animation:wag 1.2s ease-in-out infinite alternate}
.arm{transform-origin:74px 68px}
.bl{opacity:.5}
.cat{filter:drop-shadow(0 0 1.2px rgba(160,105,95,.85)) drop-shadow(0 4px 4px rgba(150,100,90,.15))}
.c{cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 3.6s infinite}
.kiss .eye{animation:shut .4s 1.1s forwards}
.boing{animation:boing .55s}
.h2{position:absolute;pointer-events:none;animation:pop2 1s ease-out forwards}
.cnt{font-weight:700;font-size:13px;margin:0 0 8px;color:#8a5f12}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes shut{to{transform:scaleY(.12)}}
@keyframes boing{30%{translate:0 -24px;scale:1.08 .92}60%{translate:0 0;scale:.93 1.07}}
@keyframes pop2{0%{transform:translate(0,0) scale(.5);opacity:1}100%{transform:translate(var(--dx),-80px) scale(1.2);opacity:0}}
.hug .c1{animation:hL 1.4s ease-in-out forwards}
.hug .c2{animation:hR 1.4s ease-in-out forwards}
.hug .arm{animation:wrapArm 1.1s .5s ease-in-out forwards}
.kiss .c1{animation:kL 1.5s ease-in-out forwards}
.kiss .c2{animation:kR 1.5s ease-in-out forwards}
.kiss .bl{animation:blush 1.5s forwards}
.pop{position:absolute;left:50%;top:0;font-size:26px;transform:translateX(-50%) scale(0);animation:pop 1s 1.3s ease-out forwards}
.msg{font-family:'Great Vibes',cursive;font-size:30px;color:#a81a2c;margin:10px 0 6px;line-height:1.1}
.again{font:700 13px 'Quicksand',system-ui,sans-serif;background:none;border:1.5px solid #c9972b;color:#8a5f12;border-radius:999px;padding:6px 14px;cursor:pointer}
.h{position:absolute;bottom:16px;pointer-events:none;animation:up 3s ease-out forwards}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.sky{position:absolute;inset:0;opacity:0;transition:opacity 2s ease}
.s0{opacity:1;background:linear-gradient(#bfe6ff,#fde6f2 62%,#fff1d6)}
.s1{background:linear-gradient(#ffc98f,#ffe3bd 55%,#fff5dc)}
.s2{background:linear-gradient(#a99be8,#f4b0d0 58%,#ffd8e8)}
.hug .s0,.kiss .s0{opacity:0}.hug .s1{opacity:1}.kiss .s2{opacity:1}
#deco{position:absolute;inset:-20px;transition:transform .4s ease-out}
.cloud{position:absolute;left:0;width:120px;height:34px;border-radius:40px;background:#fff;opacity:.9;transition:background 2s}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:54px;height:54px;left:16px;top:-26px}
.cloud::after{width:40px;height:40px;left:64px;top:-16px}
.c-a{top:14%;animation:drift 70s linear infinite}
.c-b{top:30%;scale:.75;animation:drift 100s -40s linear infinite}
.c-c{top:7%;scale:.55;animation:drift 130s -85s linear infinite}
.hug .cloud{background:#fff4df}.kiss .cloud{background:#ffe0ee}
.sun,.moon{position:absolute;border-radius:50%;opacity:0;transform:translateY(70px);transition:opacity 2s,transform 2s}
.sun{right:12%;top:12%;width:88px;height:88px;background:radial-gradient(#fff7cf,#ffcf6e);box-shadow:0 0 60px 28px rgba(255,205,110,.5)}
.moon{left:14%;top:12%;width:64px;height:64px;box-shadow:-16px 6px 0 0 #fff8dc;filter:drop-shadow(0 0 10px #fff)}
.hug .sun,.kiss .moon{opacity:1;transform:none}
.stars{position:absolute;inset:0;opacity:0;transition:opacity 2s;background:radial-gradient(2px 2px at 12% 18%,#fff,transparent),radial-gradient(2px 2px at 30% 8%,#fff,transparent),radial-gradient(3px 3px at 52% 22%,#fff,transparent),radial-gradient(2px 2px at 70% 10%,#fff,transparent),radial-gradient(2px 2px at 88% 24%,#fff,transparent),radial-gradient(3px 3px at 40% 36%,#fff,transparent);animation:twinkle 2.6s ease-in-out infinite alternate}
.kiss .stars{opacity:1}
.hills{position:absolute;left:-5%;bottom:0;width:110%;height:26vh;transition:transform .4s ease-out}
.hl1,.hl2{transition:fill 2s}
.hl1{fill:#cdeac0}.hl2{fill:#b5dda6}
.hug .hl1{fill:#f8d98e}.hug .hl2{fill:#f0c46a}
.kiss .hl1{fill:#cdb0ea}.kiss .hl2{fill:#b293dc}
#fx{position:absolute;inset:0}
.p{position:absolute;top:-30px;animation:fall 11s linear forwards}
.b{position:absolute;color:#d9a21f;font-size:16px;margin:-8px 0 0 -8px;animation:burst .9s ease-out forwards}
@keyframes drift{from{translate:-180px 0}to{translate:calc(100vw + 180px) 0}}
@keyframes twinkle{to{transform:scale(1.04) rotate(.5deg)}}
@keyframes fall{to{transform:translate(var(--dx),115vh) rotate(var(--r))}}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.cloud,.p,.stars{animation:none}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes bob{50%{transform:translateY(5px)}}
@keyframes flap{0%{transform:rotateX(0);z-index:4}49%{z-index:4}50%{z-index:1}100%{transform:rotateX(180deg);z-index:1}}
@keyframes sealGo{to{transform:scale(1.5) rotate(20deg);opacity:0}}
@keyframes nod{to{transform:rotate(4deg)}}
@keyframes wag{to{transform:rotate(14deg)}}
@keyframes hL{to{transform:translateX(30px) rotate(4deg)}}
@keyframes hR{to{transform:translateX(-30px) rotate(-4deg)}}
@keyframes wrapArm{to{transform:rotate(-105deg)}}
@keyframes kL{to{transform:translateX(28px) rotate(9deg)}}
@keyframes kR{to{transform:translateX(-28px) rotate(-9deg)}}
@keyframes blush{to{opacity:1}}
@keyframes pop{50%{transform:translateX(-50%) scale(1.5)}to{transform:translateX(-50%) scale(1)}}
@keyframes up{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-230px) scale(1.1);opacity:0}}
@media (prefers-reduced-motion:reduce){.seal,.hint,.head,.tail{animation:none}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true">
  <div class="sky s0"></div><div class="sky s1"></div><div class="sky s2"></div>
  <div id="deco">
    <div class="stars"></div><div class="sun"></div><div class="moon"></div>
    <div class="cloud c-a"></div><div class="cloud c-b"></div><div class="cloud c-c"></div>
  </div>
  <svg class="hills" viewBox="0 0 400 120" preserveAspectRatio="none"><path class="hl1" d="M0 70 Q80 30 170 62 T400 50 V120 H0Z"/><path class="hl2" d="M0 95 Q110 60 220 92 T400 80 V120 H0Z"/></svg>
  <div id="fx"></div>
</div>
<div id="stage">
  <div id="wrap" role="button" tabindex="0" aria-label="Open the letter">
    <div class="back"></div>
    <div class="letter" id="letter">
      <div class="ask">
        <div class="hrt">♡</div>
        <h1>If you were here,<br>you would…?</h1>
        <div class="choices">
          <button class="btn hug" data-m="hug">🤗 Hug</button>
          <button class="btn kiss" data-m="kiss">😘 Kiss</button>
        </div>
      </div>
      <div class="scene" id="scene">
        <div class="pair" id="pair"></div>
        <p class="msg" id="msg"></p>
        <p class="cnt" id="cnt">tap the kitties 💕</p>
        <button class="again" id="again">↺ again</button>
      </div>
    </div>
    <div class="front"></div>
    <div class="flap"></div>
    <div class="seal"><span>Kunnath</span></div>
  </div>
  <p class="hint" id="hint">tap to open</p>
</div>
<script>
const $=id=>document.getElementById(id),root=document.documentElement,wrap=$('wrap'),letter=$('letter'),scene=$('scene');
let timer=null,opened=false,hearts=['💗'],n=0;
function cat(fur,bow,boy){return `<svg class="cat" viewBox="0 0 100 112" style="--fur:${fur};--bow:${bow}"><path class="tail" d="M26 96 q-26 2 -18 -28" fill="none" stroke="var(--fur)" stroke-width="9" stroke-linecap="round"/><ellipse cx="50" cy="86" rx="25" ry="22" fill="var(--fur)"/><ellipse cx="50" cy="96" rx="13" ry="10" fill="#fff" opacity=".55"/><ellipse class="arm" cx="74" cy="84" rx="8" ry="17" fill="var(--fur)"/><g class="head"><path d="M24 34 L28 6 L46 22Z M76 34 L72 6 L54 22Z" fill="var(--fur)"/><path d="M30 24 L32 13 L40 21Z M70 24 L68 13 L60 21Z" fill="#f6a5b5"/><ellipse cx="50" cy="44" rx="29" ry="25" fill="var(--fur)"/>${boy?'<path d="M50 74 L38 67 L38 81Z M50 74 L62 67 L62 81Z" fill="var(--bow)"/><circle cx="50" cy="74" r="3.5" fill="var(--bow)"/><path d="M44 21 q3 -9 6 -2 q3 -8 6 2" fill="none" stroke="#c9a08c" stroke-width="2.5" stroke-linecap="round"/>':'<path d="M74 26 L89 16 L89 36Z M74 26 L60 16 L60 36Z" fill="var(--bow)"/><circle cx="74" cy="26" r="4.5" fill="var(--bow)" stroke="#fff" stroke-opacity=".7"/>'}<ellipse class="eye" cx="38" cy="45" rx="3.2" ry="4.2" fill="#3a2220"/><ellipse class="eye" cx="62" cy="45" rx="3.2" ry="4.2" fill="#3a2220"/><circle class="bl" cx="32" cy="54" r="6" fill="#ff8fa3"/><circle class="bl" cx="68" cy="54" r="6" fill="#ff8fa3"/><path d="M46 51 h8 l-4 5z" fill="#f06c8a"/><path d="M50 56 q-4 5 -8 2 M50 56 q4 5 8 2" stroke="#4a2c2a" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M20 49 h-12 M20 55 l-11 4 M80 49 h12 M80 55 l11 4" stroke="#4a2c2a" stroke-width="1.5" opacity=".45" stroke-linecap="round"/></g></svg>`}
function openIt(){
  if(opened)return;opened=true;
  wrap.classList.add('open');wrap.style.cursor='default';
  setTimeout(()=>{root.classList.add('read');document.body.classList.add('read');wrap.classList.add('read')},1600);
}
wrap.addEventListener('click',openIt);
wrap.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openIt()}});
const pools={d:['🌸','🍃'],hug:['🌼','🍂','✨'],kiss:['✨','⭐','💗']},fx=$('fx'),deco=$('deco'),hills=document.querySelector('.hills');
const mode=()=>root.classList.contains('kiss')?'kiss':root.classList.contains('hug')?'hug':'d';
function fall(){const p=pools[mode()],s=document.createElement('span');s.className='p';s.textContent=p[Math.floor(Math.random()*p.length)];
  s.style.left=Math.random()*100+'%';s.style.fontSize=(14+Math.random()*12)+'px';s.style.setProperty('--dx',(Math.random()*120-60)+'px');s.style.setProperty('--r',(Math.random()*360)+'deg');s.style.animationDuration=(9+Math.random()*6)+'s';fx.appendChild(s);setTimeout(()=>s.remove(),15000)}
setInterval(fall,1100);
function burst(x,y,n,ch){const p=pools[mode()];for(let i=0;i<n;i++){const s=document.createElement('span');s.className='b';s.textContent=ch||p[i%p.length];s.style.left=x+'px';s.style.top=y+'px';const a=Math.random()*6.28,d=40+Math.random()*50;s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');fx.appendChild(s);setTimeout(()=>s.remove(),950)}}
document.addEventListener('click',e=>{if(!e.target.closest('#letter,#wrap'))burst(e.clientX,e.clientY,7)});
let lt=0;
document.addEventListener('pointermove',e=>{const px=e.clientX/innerWidth-.5,py=e.clientY/innerHeight-.5;deco.style.transform=`translate(${px*-26}px,${py*-16}px)`;hills.style.transform=`translate(${px*14}px,0)`;const t=Date.now();if(t-lt>110){lt=t;burst(e.clientX,e.clientY,1,'✦')}});
function spawn(ch){
  const s=document.createElement('span');s.className='h';s.textContent=ch;
  s.style.left=(10+Math.random()*80)+'%';s.style.fontSize=(14+Math.random()*16)+'px';
  scene.appendChild(s);setTimeout(()=>s.remove(),3100);
}
function choose(m){
  const hug=m==='hug';
  $('pair').className='pair '+m;
  $('pair').innerHTML=`<div class="c c1">${cat('#fffdfb','#f0506e')}</div><div class="c c2">${cat('#fffdfb','#4f9fe8',1)}</div><div class="pop">${hug?'✨':'💋'}</div>`;
  $('msg').textContent=hug?'Warmest, tightest hug…':'A soft little kiss… mwah!';
  letter.classList.add('go');root.classList.remove('hug','kiss');root.classList.add(m);for(let i=0;i<14;i++)setTimeout(fall,i*90);
  hearts=hug?['🤍','🧡','✨']:['💗','💖','💋'];
  n=0;$('cnt').textContent='tap the kitties 💕';
  clearInterval(timer);timer=setInterval(()=>spawn(hearts[Math.floor(Math.random()*3)]),420);
}
document.querySelectorAll('.btn').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.m)));
$('pair').addEventListener('click',e=>{
  const c=e.target.closest('.c');if(!c)return;
  const svg=c.querySelector('svg');svg.classList.remove('boing');void svg.getBoundingClientRect();svg.classList.add('boing');
  n++;$('cnt').textContent=['squeak! 🐱','mew~ 💕','aww!','again, again!','purrr… 🥰'][n%5];
  const r=scene.getBoundingClientRect(),b=c.getBoundingClientRect();
  for(let i=0;i<4;i++){const s=document.createElement('span');s.className='h2';s.textContent=hearts[i%3];
    s.style.left=(b.left-r.left+b.width/2-8+Math.random()*40-20)+'px';s.style.top=(b.top-r.top+8)+'px';
    s.style.setProperty('--dx',(Math.random()*60-30)+'px');scene.appendChild(s);setTimeout(()=>s.remove(),1000)}
});
$('again').addEventListener('click',()=>{clearInterval(timer);letter.classList.remove('go');root.classList.remove('hug','kiss')});
</script>
</body>
</html>
